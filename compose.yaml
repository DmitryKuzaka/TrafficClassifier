name: trafficclassifier

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3
    ports:
      - "127.0.0.1:${CLICKHOUSE_PORT:-8123}:8123"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-traffic_classifier}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-traffic_classifier}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  clickhouse-data:
