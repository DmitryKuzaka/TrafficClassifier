[project]
name = "traffic-classifier"
version = "0.1.0"
description = "Учебный проект по ранней классификации сетевых потоков"
requires-python = ">=3.13,<3.14"
dependencies = [
    "clickhouse-connect>=1.12.0",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "tables>=3.11.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["clickhouse: needs a running local ClickHouse server"]
