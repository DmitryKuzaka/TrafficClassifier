[project]
name = "traffic-classifier"
version = "0.1.0"
description = "Учебный проект по ранней классификации сетевых потоков"
requires-python = ">=3.13,<3.14"
dependencies = [
    "clickhouse-connect>=1.12.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "tables>=3.11.1",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["clickhouse: needs a running local ClickHouse server"]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
